openapi: 3.0.3
info:
  title: 3D Scene Agent Streaming API
  version: 1.0.0
  description: API contract for chat streaming behavior and error handling.

paths:
  /chat/stream:
    post:
      summary: Stream chat responses
      description: |
        Streams responses using Server-Sent Events (SSE).
        Each `data:` line contains a JSON-encoded StreamEvent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of StreamEvent payloads.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                delta:
                  summary: Incremental assistant text
                  value: |
                    data: {"delta":"Hello ","message_id":"msg-123"}
                done:
                  summary: Completion event
                  value: |
                    data: {"event":"done","scene_has_change":true}
                error:
                  summary: Error event
                  value: |
                    data: {"error":"Stream failed"}
        '400':
          description: Invalid request payload.
        '500':
          description: Server error during streaming.

  /chat:
    post:
      summary: Chat response (non-streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Full response payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '500':
          description: Server error.

components:
  schemas:
    ChatRequest:
      type: object
      required: [message, thread_id]
      properties:
        message:
          type: string
        thread_id:
          type: string
          default: default
    ChatResponse:
      type: object
      required: [response, thread_id]
      properties:
        response:
          type: string
        thread_id:
          type: string
        todos:
          type: array
          items:
            $ref: '#/components/schemas/TodoItem'
    StreamEvent:
      type: object
      properties:
        event:
          type: string
          description: Terminal event marker, e.g. done.
        delta:
          type: string
        message_id:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        todos:
          type: array
          items:
            $ref: '#/components/schemas/TodoItem'
        scene_has_change:
          type: boolean
        error:
          type: string
    Message:
      type: object
      properties:
        type:
          type: string
        content:
          nullable: true
        additional_kwargs:
          nullable: true
        response_metadata:
          nullable: true
        name:
          type: string
          nullable: true
        id:
          type: string
          nullable: true
    TodoItem:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
