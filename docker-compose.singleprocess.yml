services:
  api:
    platform: linux/amd64
    image: scene-agent-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        INSTALL_BLENDER: ${INSTALL_BLENDER:-true}
        BLENDER_VERSION: ${BLENDER_VERSION:-4.2.15}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    env_file:
      - docker/.env.singleprocess
    environment:
      API_WORKERS: "1"
      BLENDER_MODE: headless
      SESSION_SHARED_STORAGE_ROOT: /var/lib/scene_agent/sessions
      SESSION_BLEND_ROOT: /var/lib/scene_agent/sessions
      REFERENCE_IMAGE_STORAGE_DIR: /var/lib/scene_agent/reference_images
      BLENDER_HEADLESS_LOG_DIR: /var/log/scene_agent/headless
      BLENDER_MCP_LOG_DIR: /var/log/scene_agent/mcp
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    command: ["./scripts/run_headless.sh"]
    restart: unless-stopped
    volumes:
      - session_storage:/var/lib/scene_agent/sessions
      - reference_images:/var/lib/scene_agent/reference_images
      - api_logs:/var/log/scene_agent
    ports:
      - "8000:8000"

volumes:
  session_storage:
  reference_images:
  api_logs:
