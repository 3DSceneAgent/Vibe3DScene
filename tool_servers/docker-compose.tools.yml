services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    container_name: ${POSTGRES_CONTAINER:-asset-retrieval-postgres}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_QWEN}
    volumes:
      - "${POSTGRES_DATA_DIR:-./cache/postgres}:/var/lib/postgresql/data"
      - "${POSTGRES_INIT_DIR:-./postgres/init}:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_QWEN}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tools
    restart: unless-stopped

  trellis2:
    image: ${TRELLIS2_IMAGE}
    container_name: ${TRELLIS2_CONTAINER}
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "${TRELLIS2_CONTAINER_PORT}"]
    environment:
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/hub
    ports:
      - "${TRELLIS2_HOST}:${TRELLIS2_PORT}:${TRELLIS2_CONTAINER_PORT}"
    volumes:
      - "${HUGGINGFACE_CACHE_DIR:-./cache/huggingface/hub}:/cache/huggingface/hub"
    networks:
      - tools
    restart: unless-stopped

  retrieval:
    image: ${RETRIEVAL_IMAGE}
    container_name: ${RETRIEVAL_CONTAINER}
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "${RETRIEVAL_CONTAINER_PORT}"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RETRIEVAL_HOST}:${RETRIEVAL_PORT}:${RETRIEVAL_CONTAINER_PORT}"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_QWEN: ${DB_NAME_QWEN}
      QWEN_DB_AUTO_BOOTSTRAP: ${QWEN_DB_AUTO_BOOTSTRAP}
      QWEN_DB_OSS_URL: ${QWEN_DB_OSS_URL}
      QWEN_DB_DUMP_FORMAT: ${QWEN_DB_DUMP_FORMAT}
      QWEN_DB_DUMP_LOCAL_PATH: ${QWEN_DB_DUMP_LOCAL_PATH}
      QWEN_DB_REUSE_LOCAL_DUMP: ${QWEN_DB_REUSE_LOCAL_DUMP:-true}
      QWEN_DB_DOWNLOAD_TIMEOUT_SECONDS: ${QWEN_DB_DOWNLOAD_TIMEOUT_SECONDS}
      MAX_ASSETS: ${MAX_ASSETS}
      LOG_LEVEL: ${LOG_LEVEL}
      BASE_URL_TEMPLATE: ${BASE_URL_TEMPLATE}
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/hub
    volumes:
      - "${RETRIEVAL_CACHE_DIR:-./cache/asset-retrieval}:/cache/asset-retrieval"
      - "${HUGGINGFACE_CACHE_DIR:-./cache/huggingface/hub}:/cache/huggingface/hub"
    networks:
      - tools
    restart: unless-stopped

  scenesmith_retrieval:
    build:
      context: ./SceneSmithRetrieval
    container_name: ${SCENESMITH_RETRIEVAL_CONTAINER:-scenesmith-retrieval-server}
    command: ["bash", "scripts/run_compat_service.sh"]
    ports:
      - "${RETRIEVAL_HOST}:${RETRIEVAL_PORT}:${RETRIEVAL_CONTAINER_PORT}"
    environment:
      RETRIEVAL_HOST: 0.0.0.0
      RETRIEVAL_PORT: ${RETRIEVAL_CONTAINER_PORT}
      SCENESMITH_ENABLE_HSSD: ${SCENESMITH_ENABLE_HSSD}
      SCENESMITH_ENABLE_AMBIENTCG: ${SCENESMITH_ENABLE_AMBIENTCG}
      HSSD_DATA_PATH: /app/data/hssd-models
      HSSD_PREPROCESSED_PATH: /app/data/preprocessed
      HSSD_ARTIFACT_ROOT: /app/artifacts/hssd_service
      AMBIENTCG_DATA_PATH: /app/data/materials
      AMBIENTCG_EMBEDDINGS_PATH: /app/data/materials/embeddings
      AMBIENTCG_ARTIFACT_ROOT: /app/artifacts/ambientcg_service
    volumes:
      - "${HSSD_DATA_PATH}:/app/data/hssd-models:ro"
      - "${HSSD_PREPROCESSED_PATH}:/app/data/preprocessed:ro"
      - "${HSSD_ARTIFACT_ROOT}:/app/artifacts/hssd_service"
      - "${AMBIENTCG_DATA_PATH}:/app/data/materials:ro"
      - "${AMBIENTCG_EMBEDDINGS_PATH}:/app/data/materials/embeddings:ro"
      - "${AMBIENTCG_ARTIFACT_ROOT}:/app/artifacts/ambientcg_service"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload = json.loads(urllib.request.urlopen('http://127.0.0.1:${RETRIEVAL_CONTAINER_PORT}/health', timeout=5).read().decode('utf-8')); raise SystemExit(0 if payload.get('status') == 'running' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - tools
    restart: unless-stopped

  pcg:
    image: ${PCG_IMAGE}
    container_name: ${PCG_CONTAINER}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${PCG_CONTAINER_PORT}"]
    ports:
      - "${PCG_HOST}:${PCG_PORT}:${PCG_CONTAINER_PORT}"
    environment:
      ENVIRONMENT: ${PCG_ENVIRONMENT}
      OUTPUT_BASE_DIR: ${PCG_OUTPUT_BASE_DIR}
    networks:
      - tools
    restart: unless-stopped

  samserver:
    build:
      context: ./SAMServer
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: ${SAMSERVER_CONTAINER:-samserver-http}
    ports:
      - "${SAMSERVER_HOST:-0.0.0.0}:${SAMSERVER_PORT:-8004}:${SAMSERVER_CONTAINER_PORT:-8003}"
    environment:
      HF_TOKEN: ${HUGGINGFACE_TOKEN}
      MODEL_ROOT: /models
      SAM_HTTP_JOB_ROOT: /var/lib/sam-http/jobs
      SAM_INTERNAL_PORT: ${SAMSERVER_INTERNAL_SAM_PORT:-8001}
      SAM3D_INTERNAL_PORT: ${SAMSERVER_INTERNAL_SAM3D_PORT:-8002}
      SAM_HTTP_PORT: ${SAMSERVER_CONTAINER_PORT:-8003}
    volumes:
      - "${SAMSERVER_MODEL_DIR:-./cache/samserver/models}:/models"
      - "${SAMSERVER_JOB_DIR:-./cache/samserver/jobs}:/var/lib/sam-http/jobs"
    networks:
      - tools
    restart: unless-stopped

networks:
  tools:
    name: ${DOCKER_NETWORK}
